# DentiaCore - configuracion base de MongoDB (sin BOM).
# IMPORTANTE: como servicio de Windows, mongod corre con working dir en
# C:\Windows\System32. install.ps1 REESCRIBE este archivo con rutas ABSOLUTAS
# al registrar/normalizar el servicio. Las rutas ABSOLUTAS de abajo se generan
# durante la instalacion; si mueves la carpeta del proyecto, vuelve a correr
# install.ps1 para actualizar estas rutas.
#   cd <repo>; mongod --config mongod.cfg
systemLog:
  destination: file
  path: C:\Users\USER\Desktop\DentiaCore-master\DB\logs\mongod.log
  logAppend: true
storage:
  dbPath: C:\Users\USER\Desktop\DentiaCore-master\DB
net:
  bindIp: 127.0.0.1
  port: 27017
