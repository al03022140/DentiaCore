# DentiaCore - configuracion base de MongoDB (sin BOM).
# IMPORTANTE: como servicio de Windows, mongod corre con working dir en
# C:\Windows\System32. install.ps1 REESCRIBE este archivo con rutas ABSOLUTAS
# al registrar/normalizar el servicio. Las rutas relativas de abajo solo son
# validas si ejecutas mongod manualmente desde la raiz del repo:
#   cd <repo>; mongod --config mongod.cfg
systemLog:
  destination: file
  path: DB/logs/mongod.log
  logAppend: true
storage:
  dbPath: DB
net:
  bindIp: 0.0.0.0
  port: 27017
