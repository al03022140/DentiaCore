# A-11: pipeline de CI. Antes existía una suite de pruebas (25 archivos con
# jest + supertest + mongodb-memory-server) pero nada la ejecutaba en push/PR,
# así que las regresiones se publicaban en silencio.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - name: Install server deps
        working-directory: Server
        run: npm ci
      - name: Run server tests
        working-directory: Server
        run: npm test

  client-tests:
    name: Client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - name: Install client deps
        working-directory: Client
        run: npm ci
      - name: Run client tests
        working-directory: Client
        run: npm test

  lint:
    name: Lint (naming / normalización)
    runs-on: ubuntu-latest
    # Gate ESTRICTO (Fase 0 de normalización). Hoy queda en rojo a propósito:
    # hay ~583 violaciones legacy que se resuelven en las fases de migración
    # (ver docs/normalizacion/). El objetivo es que el número baje hasta 0.
    # continue-on-error: no bloquea merges mientras las ~583 violaciones bajan
    # a 0 — el check queda visible (rojo) en cada PR sin ser obligatorio.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server deps
        working-directory: Server
        run: npm ci
      - name: Lint server (estricto)
        working-directory: Server
        run: npm run lint
      - name: Install client deps
        working-directory: Client
        run: npm ci
      - name: Lint client (estricto)
        working-directory: Client
        run: npm run lint
